# Intuitively split panes using | and - (and open in current directory)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Start window and pane numbering at 1 (instead of 0) for keyboard reach
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Increase history scrollback limit
set -g history-limit 1000000

# True color support for modern terminals
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
